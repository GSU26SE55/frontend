name: CI — Frontend

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (ReactJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Build
        run: npm run build
